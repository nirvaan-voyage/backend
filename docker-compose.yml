services:
  postgres:
    image: postgres:16-alpine
    container_name: nirvaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nirvaan
      POSTGRES_USER: nirvaan
      POSTGRES_PASSWORD: nirvaan
    ports:
      - "5432:5432"
    volumes:
      - nirvaan_postgres_data:/var/lib/postgresql/data
      - ./internal/database/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  nirvaan_postgres_data:
